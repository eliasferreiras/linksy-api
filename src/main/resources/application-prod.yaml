server:
  port: 8085

spring:
  application:
    name: linksy-api
  datasource:
    url: jdbc:postgresql://localhost:5432/linksy
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
app:
  cors:
    allowed-origins: https://linksy.eliaslabs.dev
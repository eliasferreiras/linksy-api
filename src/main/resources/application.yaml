spring:
  application:
    name: linksy-api
  datasource:
    url: jdbc:postgresql://localhost:5432/shortlink
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
app:
  cors:
    allowed-origins: http://localhost:5173
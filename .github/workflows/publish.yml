name: Publish Release

on:
  workflow_call:

jobs:
  release:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Baixar o código do repositório
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Configurar o Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 3. Compilar e executar os testes
      - name: Build
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      # 4. Preparar o JAR
      - name: Prepare JAR
        run: |
          JAR_FILE=$(find target -maxdepth 1 -type f \
            -name '*.jar' ! -name '*.jar.original' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "JAR não encontrado!"
            exit 1
          fi

          cp "$JAR_FILE" linksy-api.jar

      # 5. Configurar SSH
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. Enviar JAR para o servidor
      - name: Upload JAR
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_SSH_PORT}}
          SSH_USER: ${{ secrets.SERVER_USER}}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -P "$SSH_PORT" \
            linksy-api.jar \
            "$SSH_USER@$SSH_HOST:/tmp/linksy-api.jar"

      # 7. Instalar o JAR e reiniciar a API
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'sudo /usr/bin/install -m 0644 /tmp/linksy-api.jar /opt/linksy/linksy-api.jar &&
             sudo /usr/bin/systemctl restart linksy &&
             sudo /usr/bin/systemctl is-active linksy'
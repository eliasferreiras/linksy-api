name: Publish Release

on:
  workflow_call:

jobs:
  release:
    name: Publish to Production
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: linksy-api
          path: artifact/

      # 5. Configurar SSH
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. Enviar JAR para o servidor
      - name: Upload JAR
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_SSH_PORT}}
          SSH_USER: ${{ secrets.SERVER_USER}}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p $SSH_PORT" \
            artifact/linksy-api.jar \
            "$SSH_USER@$SSH_HOST:/tmp/linksy-api.jar"

      # 7. Instalar o JAR e reiniciar a API
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            'sudo /usr/local/sbin/deploy-linksy'